<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Party Pulse - Discover the best parties and festivals in Borsod-Abaúj-Zemplén county.">
    <title>Party Pulse | BAZ County Events</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="logo">PARTY<span>PULSE</span></div>
        <ul class="nav-links">
            <li><a href="#" onclick="showPage('home')">Home</a></li>
            <li><a href="#" onclick="showPage('events')">Events</a></li>
            <li><a href="#" onclick="showPage('ranking')">Ranking</a></li>
            <li id="auth-link"><a href="#" onclick="showPage('login')" class="btn-neon">Login</a></li>
        </ul>
        <div class="menu-toggle" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
    </nav>
    <section id="home" class="page active">
        <div class="hero">
            <div class="hero-content">
                <h1>Find the Best Parties in <span class="text-gradient">BAZ County</span></h1>
                <p>Miskolc, Ózd, Mezőkövesd and more! Don't miss the beat.</p>
                <div class="quick-search">
                    <input type="text" id="hero-search" placeholder="Search by city or keyword...">
                    <button onclick="quickSearch()">Go <i class="fas fa-bolt"></i></button>
                </div>
            </div>
        </div>
        
        <div class="container">
            <h2 class="section-title">Featured Events <i class="fas fa-fire"></i></h2>
            <div class="event-grid" id="featured-events">
                </div>
        </div>
    </section>
</body>
</html>
